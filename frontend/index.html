<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOW THAILAND | Luxury Hotels, Cabs &amp; Signature Activities</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <!-- Opening intro styles -->
    <link rel="stylesheet" href="/intro/wow-intro.css">
  </head>
  <body>
    <!-- WOW THAILAND opening intro (styles & script in public/intro/).
         Static markup so it paints before React loads.
         The video element, stars and animations are injected by wow-intro.js. -->
    <div id="wow-intro" class="wow-intro" role="dialog" aria-label="Welcome to WOW THAILAND" hidden>
      <div class="wow-intro__sky" aria-hidden="true"></div>
      <div class="wow-intro__stars" aria-hidden="true"></div>
      <div class="wow-intro__frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="wow-intro__stage">
        <div class="wow-intro__scene"></div>
        <div class="wow-intro__temple" aria-hidden="true"></div>
        <div class="wow-intro__reflection" aria-hidden="true"></div>
        <div class="wow-intro__glow" aria-hidden="true"></div>
        <div class="wow-intro__ribbon" aria-hidden="true">
          <svg class="wow-intro__ribbon-track" viewBox="0 0 1200 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M0 30 Q300 10 600 30 Q900 50 1200 30" stroke="url(#rg)" stroke-width="1.5" fill="none"/>
            <defs>
              <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#f5c518" stop-opacity="0"/>
                <stop offset="30%" stop-color="#f5c518" stop-opacity="0.6"/>
                <stop offset="70%" stop-color="#f5c518" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="wow-intro__title" role="img" aria-label="WOW THAILAND">
          <span class="wow-intro__word wow-intro__word--wow" aria-hidden="true">
            <span>W</span><span>O</span><span>W</span>
          </span>
          <span class="wow-intro__word wow-intro__word--thailand" aria-hidden="true">
            <span>T</span><span>H</span><span>A</span><span>I</span><span>L</span><span>A</span><span>N</span><span>D</span>
          </span>
        </div>
        <p class="wow-intro__subtitle" aria-hidden="true">Discover the Land of Smiles</p>
        <p class="wow-intro__caption" aria-hidden="true"></p>
        <div class="wow-intro__flakes" aria-hidden="true"></div>
        <div class="wow-intro__dust" aria-hidden="true"></div>
      </div>
      <div class="wow-intro__sweep" aria-hidden="true"></div>
      <div class="wow-intro__bottom" aria-hidden="true">
        <span class="wow-intro__bottom-label">HOTELS · CABS · SIGNATURE EXPERIENCES</span>
        <div class="wow-intro__progress"><i></i></div>
        <span class="wow-intro__bottom-cta">CLICK ANYWHERE TO ENTER</span>
        <button type="button" class="wow-intro__skip" aria-label="Skip intro">Skip ›</button>
      </div>
    </div>

    <script src="/intro/wow-intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
